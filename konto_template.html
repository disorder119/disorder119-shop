<!DOCTYPE html>
<html lang="__HTML_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Disorder119">
<meta name="description" content="__META_DESC__">
<!-- Private Seite: nichts davon gehoert in einen Suchindex. -->
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<link rel="canonical" href="__CANONICAL_URL__">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<title>__META_TITLE__</title>
<link rel="stylesheet" href="/assets/app.css?v=__APP_CSS_VERSION__">
<link rel="stylesheet" href="/assets/konto.css?v=__APP_CSS_VERSION__">
</head>
<body class="konto-seite">
<header class="konto-kopf">
  <a class="konto-marke" href="__HOME__">DISORDER119</a>
  <button type="button" class="konto-btn konto-btn--schlicht" id="kontoAbmelden" hidden>Abmelden</button>
</header>

<main class="konto-inhalt">
  <h1 id="kontoTitel">Dein Konto</h1>
  <p class="konto-meldung" id="kontoMeldung" tabindex="-1" role="status" hidden></p>

  <section class="konto-block" id="kontoAnmeldung" hidden>
    <p id="kontoLoginIntro"></p>
    <form id="kontoLoginForm" class="konto-form konto-form--schmal" novalidate>
      <label class="konto-feld">
        <span id="kontoLoginLabel">E-Mail-Adresse</span>
        <input type="email" id="kontoLoginEmail" name="email" autocomplete="email" required>
      </label>
      <button type="submit" class="konto-btn" id="kontoLoginBtn">Anmeldelink schicken</button>
    </form>
  </section>

  <div id="kontoBereich" hidden>
    <p class="konto-konto"><span id="kontoEmail"></span></p>

    <section class="konto-block">
      <h2 id="kontoBestellungenTitel">Bestellungen</h2>
      <div id="kontoBestellungen"></div>
    </section>

    <section class="konto-block">
      <h2 id="kontoAdresseTitel">Lieferadresse</h2>
      <form id="kontoAdressForm" class="konto-form konto-form--adresse" novalidate>
        <label class="konto-feld konto-feld--breit"><span id="adrNameLabel">Name</span>
          <input type="text" id="adrName" autocomplete="name" required></label>
        <label class="konto-feld konto-feld--breit"><span id="adrStrasseLabel">Straße und Hausnummer</span>
          <input type="text" id="adrStrasse" autocomplete="address-line1" required></label>
        <label class="konto-feld konto-feld--breit"><span id="adrZusatzLabel">Adresszusatz</span>
          <input type="text" id="adrZusatz" autocomplete="address-line2"></label>
        <label class="konto-feld"><span id="adrPlzLabel">PLZ</span>
          <input type="text" id="adrPlz" autocomplete="postal-code" inputmode="numeric" required></label>
        <label class="konto-feld"><span id="adrOrtLabel">Ort</span>
          <input type="text" id="adrOrt" autocomplete="address-level2" required></label>
        <label class="konto-feld"><span id="adrLandLabel">Land</span>
          <input type="text" id="adrLand" autocomplete="country" value="DE" maxlength="2"></label>
        <button type="submit" class="konto-btn" id="adrSpeichern">Adresse speichern</button>
      </form>
    </section>

    <section class="konto-block konto-block--daten">
      <h2 id="kontoDatenTitel">Deine Daten</h2>
      <div class="konto-datenknoepfe">
        <button type="button" class="konto-btn konto-btn--schlicht" id="kontoExport">Daten herunterladen</button>
        <button type="button" class="konto-btn konto-btn--warnung" id="kontoLoeschen">Konto löschen lassen</button>
      </div>
    </section>
  </div>
</main>

<footer class="konto-fuss">
  <a href="__HOME__agb/">AGB</a>
  <a href="__HOME__datenschutz/">Datenschutz</a>
  <a href="__HOME__impressum/">Impressum</a>
</footer>

<script>window.SHOP_CONFIG = __SHOP_CONFIG_JSON__;</script>
<script src="/assets/konto.js?v=__APP_CSS_VERSION__" defer></script>
</body>
</html>
