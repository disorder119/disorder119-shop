name: ChatGPT TikTok Demo

on:
  push:
    branches:
      - chatgpt-tiktok-demo-20260916

jobs:
  render-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify original product images
        run: |
          ls -lh assets/img/b2-241/{0,1,2,3,4,5,6}.webp
          file assets/img/b2-241/{0,1,2,3,4,5,6}.webp

      - name: Generate original demo beat
        run: |
          python3 - <<'PY'
          import wave, math, random
          from array import array
          sr = 44100
          duration = 15.0
          n = int(sr * duration)
          audio = array('f', [0.0]) * n
          bpm = 150.0
          beat = 60.0 / bpm
          def add_kick(t0, amp=0.95):
              start = int(t0 * sr); length = min(int(0.22 * sr), n - start); phase = 0.0
              for j in range(max(0, length)):
                  t = j / sr; freq = 46.0 + 72.0 * math.exp(-t * 18.0)
                  phase += 2.0 * math.pi * freq / sr
                  audio[start+j] += amp * math.sin(phase) * math.exp(-t * 20.0)
          def add_hat(t0, amp=0.11):
              start = int(t0 * sr); length = min(int(0.045 * sr), n - start); rng = random.Random(start + 119)
              for j in range(max(0, length)):
                  t = j / sr
                  audio[start+j] += amp * (rng.random()*2.0-1.0) * math.exp(-t * 95.0)
          def add_clap(t0, amp=0.18):
              start = int(t0 * sr); length = min(int(0.11 * sr), n - start); rng = random.Random(start + 911)
              for j in range(max(0, length)):
                  t = j / sr
                  audio[start+j] += amp * (rng.random()*2.0-1.0) * math.exp(-t * 34.0)
          q = 0
          while q * beat < duration:
              t0 = q * beat
              add_kick(t0, 0.92 if q % 4 in (0,2) else 0.78)
              if q % 4 in (1,3): add_clap(t0)
              add_hat(t0, 0.10); add_hat(t0 + beat/2.0, 0.13)
              q += 1
          bass_notes = [55.0, 55.0, 65.406, 49.0]
          for i in range(n):
              t = i / sr; f = bass_notes[int(t / beat) % len(bass_notes)]
              gate = 1.0 if (t % beat) < beat * 0.58 else 0.0
              audio[i] += (0.10 * math.sin(2*math.pi*f*t) + 0.035 * math.sin(2*math.pi*f*2*t)) * gate
          peak = max(1e-9, max(abs(x) for x in audio)); gain = 0.88 / peak; fade = int(0.25 * sr); pcm = array('h')
          for i, x in enumerate(audio):
              g = gain
              if i < fade: g *= i / fade
              if i >= n - fade: g *= (n - 1 - i) / fade
              pcm.append(int(max(-1.0, min(1.0, x * g)) * 32767))
          with wave.open('beat.wav', 'wb') as wf:
              wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(sr); wf.writeframes(pcm.tobytes())
          PY

      - name: Build aggressive full-HD fashion cut
        run: |
          cat > scenes.txt <<'EOF'
          file 'assets/img/b2-241/0.webp'
          duration 0.60
          file 'assets/img/b2-241/1.webp'
          duration 0.60
          file 'assets/img/b2-241/2.webp'
          duration 0.60
          file 'assets/img/b2-241/3.webp'
          duration 0.60
          file 'assets/img/b2-241/4.webp'
          duration 0.60
          file 'assets/img/b2-241/5.webp'
          duration 0.60
          file 'assets/img/b2-241/6.webp'
          duration 0.60
          file 'assets/img/b2-241/6.webp'
          duration 0.55
          file 'assets/img/b2-241/5.webp'
          duration 0.55
          file 'assets/img/b2-241/4.webp'
          duration 0.55
          file 'assets/img/b2-241/3.webp'
          duration 0.55
          file 'assets/img/b2-241/2.webp'
          duration 0.55
          file 'assets/img/b2-241/1.webp'
          duration 0.55
          file 'assets/img/b2-241/0.webp'
          duration 0.55
          file 'assets/img/b2-241/1.webp'
          duration 0.55
          file 'assets/img/b2-241/3.webp'
          duration 0.55
          file 'assets/img/b2-241/5.webp'
          duration 0.55
          file 'assets/img/b2-241/0.webp'
          duration 0.55
          file 'assets/img/b2-241/2.webp'
          duration 0.55
          file 'assets/img/b2-241/4.webp'
          duration 0.55
          file 'assets/img/b2-241/6.webp'
          duration 0.55
          file 'assets/img/b2-241/0.webp'
          duration 0.60
          file 'assets/img/b2-241/3.webp'
          duration 0.60
          file 'assets/img/b2-241/6.webp'
          duration 0.60
          file 'assets/img/b2-241/0.webp'
          duration 1.30
          file 'assets/img/b2-241/0.webp'
          EOF
          BOLD=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          ffmpeg -y -hide_banner -loglevel warning \
            -f concat -safe 0 -i scenes.txt -i beat.wav \
            -filter_complex "[0:v]scale=1040:1660:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2-55:color=black,fps=30,format=yuv420p,drawtext=fontfile=${BOLD}:text='DISORDER119':x=w-tw-58:y=54:fontsize=34:fontcolor=white@0.78,drawtext=fontfile=${BOLD}:text='JEAN PAUL GAULTIER':x=58:y=74:fontsize=52:fontcolor=white:enable='between(t,0,4.2)',drawtext=fontfile=${BOLD}:text='90 €':x=56:y=145:fontsize=118:fontcolor=white:enable='between(t,0,4.2)',drawtext=fontfile=${BOLD}:text='SIZE M / 38':x=60:y=292:fontsize=34:fontcolor=black:box=1:boxcolor=white:boxborderw=15:enable='between(t,0,4.2)',drawtext=fontfile=${BOLD}:text='JPG  /  90 €  /  M':x=58:y=76:fontsize=42:fontcolor=white:enable='between(t,4.2,13.7)',drawbox=x=58:y=136:w=292:h=4:color=white@0.70:t=fill:enable='between(t,4.2,13.7)',drawtext=fontfile=${BOLD}:text='JEAN PAUL GAULTIER':x=58:y=114:fontsize=55:fontcolor=white:enable='between(t,13.7,15)',drawtext=fontfile=${BOLD}:text='90 €':x=58:y=194:fontsize=126:fontcolor=white:enable='between(t,13.7,15)',drawtext=fontfile=${BOLD}:text='SIZE M / 38':x=62:y=356:fontsize=34:fontcolor=black:box=1:boxcolor=white:boxborderw=15:enable='between(t,13.7,15)'[v]" \
            -map '[v]' -map 1:a -t 15 \
            -c:v libx264 -preset slow -crf 15 -profile:v high -level 4.2 -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 192k -movflags +faststart DISORDER119_JPG_DEMO_ORIGINALS_FHD.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json DISORDER119_JPG_DEMO_ORIGINALS_FHD.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: disorder119-tiktok-demo-originals
          path: DISORDER119_JPG_DEMO_ORIGINALS_FHD.mp4
          if-no-files-found: error
          retention-days: 1
