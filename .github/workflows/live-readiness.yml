name: Public technical readiness

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/check_live_readiness.py
      - scripts/test_live_readiness.py
      - .github/workflows/live-readiness.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostics-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p test_live_readiness.py -v

  public-get-checks:
    if: github.event_name == 'workflow_dispatch'
    needs: diagnostics-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Public GET checks, without login or business-data writes
        run: python scripts/check_live_readiness.py --output live-readiness.json
      - name: Save limited technical results, not a legal or payment certification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-technical-readiness
          path: live-readiness.json
          if-no-files-found: warn
          retention-days: 14
