name: Public technical readiness

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/check_live_readiness.py
      - scripts/test_live_readiness.py
      - .github/workflows/live-readiness.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostics-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p test_live_readiness.py -v

  public-get-checks:
    if: github.event_name == 'workflow_dispatch'
    needs: diagnostics-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Public GET checks, without login or business-data writes
        run: python scripts/check_live_readiness.py --output live-readiness.json
      - name: Save limited technical results, not a legal or payment certification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-technical-readiness
          path: live-readiness.json
          if-no-files-found: warn
          retention-days: 14
