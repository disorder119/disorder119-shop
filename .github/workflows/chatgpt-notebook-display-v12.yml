name: ChatGPT Notebook Display V12
on:
  push:
    branches: [chatgpt-notebook-display-v12-20260920]
    paths: ["tools/build_notebook_display_v12.py", ".github/workflows/chatgpt-notebook-display-v12.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          pip install pillow qrcode
      - run: python tools/build_notebook_display_v12.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disorder119-notebook-display-v12
          path: out_notebook_display_v12/*
          if-no-files-found: error
          retention-days: 7
