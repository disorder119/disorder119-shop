name: ChatGPT Notebook Cover V3

on:
  push:
    branches:
      - chatgpt-notebook-cover-v3-20260920
    paths:
      - "tools/build_notebook_v3.py"
      - "tools/run_notebook_v3.py"
      - ".github/workflows/chatgpt-notebook-v3.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pillow qrcode reportlab
      - name: Verify website copy and build eight variants from real shop assets
        run: python tools/run_notebook_v3.py
      - name: Upload variants
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disorder119-notebook-cover-v3
          path: out_notebook_v3/*
          if-no-files-found: error
          retention-days: 7
