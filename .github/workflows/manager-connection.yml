name: Read-only Manager grants
on:
  pull_request:
    branches: [main]
    paths: ['shop-worker/**', '.github/workflows/manager-connection.yml']
  push:
    branches: [main]
    paths: ['shop-worker/**', '.github/workflows/manager-connection.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node --test shop-worker/manager-connection.test.mjs shop-worker/admin-passkeys.test.mjs shop-worker/tax-dataset-stream.test.mjs shop-worker/tax-dataset-v3-originals.test.mjs shop-worker/tax-export-consistency.test.mjs shop-worker/manager-export-contract.test.mjs
