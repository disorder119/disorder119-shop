name: Read-only Manager grants
on:
  pull_request:
    branches: [main]
    paths: ['shop-worker/**', '.github/workflows/manager-connection.yml']
  push:
    branches: [main]
    paths: ['shop-worker/**', '.github/workflows/manager-connection.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test shop-worker/manager-connection.test.mjs shop-worker/admin-passkeys.test.mjs shop-worker/tax-dataset-stream.test.mjs
