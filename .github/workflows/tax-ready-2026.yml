name: Tax Ready 2026 Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "shop-worker/tax-ready-2026.js"
      - "shop-worker/tax-ready-dataset-v3.js"
      - "shop-worker/tax-ready-2026.test.mjs"
      - "shop-worker/tax-ready-vorgaenge.js"
      - "shop-worker/tax-ready-vorgaenge.test.mjs"
      - "shop-worker/packlink.js"
      - "data/catalog.json"
      - "shop-worker/migrations/0026_tax_ready_2026.sql"
      - "shop-worker/migrations/0027_tax_ready_safety.sql"
      - "shop-worker/migrations/0028_tax_document_lifecycle.sql"
      - "shop-worker/buchhaltung.js"
      - "shop-worker/TAX_DATASET_V3.md"
      - "data/items.json"
      - ".github/workflows/tax-ready-2026.yml"
  push:
    branches: [main]
    paths:
      - "shop-worker/tax-ready-2026.js"
      - "shop-worker/tax-ready-dataset-v3.js"
      - "shop-worker/tax-ready-2026.test.mjs"
      - "shop-worker/tax-ready-vorgaenge.js"
      - "shop-worker/tax-ready-vorgaenge.test.mjs"
      - "shop-worker/packlink.js"
      - "data/catalog.json"
      - "shop-worker/migrations/0026_tax_ready_2026.sql"
      - "shop-worker/migrations/0027_tax_ready_safety.sql"
      - "shop-worker/migrations/0028_tax_document_lifecycle.sql"
      - "shop-worker/buchhaltung.js"
      - "shop-worker/TAX_DATASET_V3.md"
      - "data/items.json"
      - ".github/workflows/tax-ready-2026.yml"

permissions:
  contents: read

jobs:
  tax-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Neue Tax-Module syntaktisch prüfen
        run: |
          set -euo pipefail
          node --check shop-worker/tax-ready-2026.js
          node --check shop-worker/tax-ready-dataset-v3.js
          node --check shop-worker/tax-ready-vorgaenge.js
          node --check shop-worker/buchhaltung.js

      - name: Tax-Ready-Regressionen ausführen
        run: node --test shop-worker/tax-ready-2026.test.mjs shop-worker/tax-ready-vorgaenge.test.mjs

      - name: Vollständige D1-Migrationskette prüfen
        run: python3 scripts/test_d1_migrations.py
