name: Seite automatisch neu bauen

# Baut die statischen Seiten aus data/items.json und den Quelltemplates neu.
# Asset- und Shop-Konfigurationsaenderungen loesen ebenfalls einen Rebuild aus,
# damit Cache-Busting und eingebettete Shop-Konfiguration aktuell bleiben.

on:
  push:
    branches: [main]
    paths:
      - "data/items.json"
      - "index_template.html"
      - "build_site.py"
      - "config/shop-config.json"
      - "assets/app.js"
      - "assets/app.css"
      - "assets/article.js"
      - "assets/article.css"
      - ".github/workflows/rebuild.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install pillow

      - name: Seite bauen
        run: python build_site.py

      - name: Ergebnis committen
        run: |
          git config user.name "disorder119-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html artikel sitemap.xml cart impressum agb datenschutz ueber-uns faq match chaos baukasten en fr data/catalog.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen am generierten Output - nichts zu committen."
          else
            git commit -m "Automatischer Rebuild"
            git push
          fi
