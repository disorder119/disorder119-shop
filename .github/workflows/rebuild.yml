name: Seite automatisch neu bauen

# Baut die statischen Seiten aus data/items.json und den Quelltemplates neu.
# Vor jedem Commit laufen Syntax-, Katalog-, SEO-, Commerce- und Regressionstests.
# Der Archivfilter hat zusaetzliche Regressionen fuer Sichtbarkeit, Reset und Facetten.
# Match, Chaos und Baukasten sind ueber config/mode-guard.json gegen unbeabsichtigte
# Aenderungen geschuetzt; der Guard wird niemals automatisch neu gesetzt.
#
# Mehrere sehr schnell aufeinanderfolgende Pushes auf main (z. B. viele
# Admin-Speicherungen innerhalb von Sekunden) koennen dazu fuehren, dass der
# publish-Push hier mit "non-fast-forward" fehlschlaegt, weil main zwischen
# Checkout und Push schon wieder weitergewandert ist - items.json bleibt dabei
# stets korrekt, nur der abgeleitete Rebuild (catalog.json/HTML) bleibt dann
# hinter dem letzten Stand zurueck. Abhilfe: ein einzelner, unabhaengiger Push
# (z. B. ein kleiner gemergter PR) nach Abschluss der Bearbeitung stoesst die
# Pipeline einmal unbehelligt neu an.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "data/items.json"
      - "data/catalog-taxonomy-report.json"
      - "index_template.html"
      - "build_site.py"
      - "robots.txt"
      - "admin/index.html"
      - "config/shop-config.json"
      - "config/legal-content.json"
      - "config/mode-guard.json"
      - "config/photo-sources.json"
      - "config/catalog-number-links.json"
      - "tools/fotoquellen.py"
      - "assets/**"
      - "shop-worker/**"
      - "scripts/**"
      - ".github/**"
  workflow_dispatch: {}

# Validation, including same-repository PRs, receives READ ONLY repository
# access. The only write token exists in the separate publish job, which is
# impossible to run for pull_request events.
permissions:
  contents: read

# A publication must finish before the next one starts. Every deployment also
# checks current main again, so queued stale builds cannot overwrite new items.
concurrency:
  group: shop-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Repo auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Abhaengigkeiten installieren
        run: pip install pillow PyYAML==6.0.3

      - name: Release-Gates pruefen
        run: python -m unittest discover -s scripts -p test_release_quality_gate.py -v

      - name: SEO-Regressionspruefungen
        run: |
          python scripts/test_seo_catalog.py
          python scripts/test_french_titles.py
          node scripts/test_archive_localization.cjs
          python scripts/test_mobile_product_hero.py

      - name: Python Syntax pruefen
        run: python -m py_compile build_site.py scripts/*.py

      - name: Cloudflare-Publikation ohne Zugangsdaten pruefen
        run: |
          python -m unittest discover -s scripts -p test_storefront_publishing.py -v
          node --test shop-worker/storefront-assets.test.mjs shop-worker/storefront-edge.test.mjs shop-worker/storefront-csp.test.mjs

      - name: Bestaetigte Artikelnummern gegen feste Produkt-IDs pruefen
        run: |
          python scripts/validate_catalog_number_links.py
          python scripts/test_catalog_number_links.py

      - name: Fotoquellen pruefen (Shop-Bild -> Freisteller -> Artikelnummer)
        run: |
          python scripts/validate_photo_sources.py
          python scripts/test_photo_sources.py

      - name: Verifizierte Katalog-Quellfehler reparieren
        run: python scripts/repair_catalog_source_integrity.py

      - name: Bestaetigte Maengel im Merchant-Feed pruefen
        run: python scripts/test_catalog_defect_feed.py

      - name: Produktdaten nur aus expliziten Quellen vervollstaendigen
        run: python scripts/repair_product_metadata_conservative.py

      - name: Archiv-Taxonomie-Filter anwenden
        run: |
          if grep -q 'id="filterDepartment"' index_template.html \
             && grep -q 'id="filterProductType"' index_template.html \
             && grep -q 'var DEPARTMENT_LABELS = {' assets/app.js \
             && grep -q 'it.taxonomy_category || it.category' assets/app.js; then
            echo "Archiv-Taxonomie-Filter bereits im Quellstand vorhanden."
          else
            python scripts/apply_archive_taxonomy_filters.py
          fi

      - name: Archiv-Filter-UX anwenden
        run: |
          if grep -q 'AUDIT_PERFECT_NATIVE_FACETS' assets/app.js \
             && grep -q 'function renderActiveFilters()' assets/app.js \
             && grep -q 'id="activeFilters"' index_template.html; then
            echo "Archiv-Filter-UX inklusive Audit-Facets bereits vorhanden."
          else
            python scripts/apply_archive_filter_ux.py
          fi

      - name: Archiv-Filter-Bugfixes anwenden
        run: python scripts/apply_archive_filter_bugfixes.py

      - name: Live-Katalog-Polish anwenden
        run: python scripts/apply_live_catalog_polish.py

      - name: Katalog-, Anfrage- und Size-UX anwenden
        run: |
          if grep -q 'it.size_normalized, it.article, String(it.id || "")' assets/app.js \
             && grep -q 'class="plate__size"' assets/app.js \
             && grep -q 'item.article, item.id, itemCategory(item), item.size' assets/rental-v2-picker.js \
             && grep -q 'lines.push("   URL: " + window.location.origin + HOME + "artikel/" + item.id + "/")' assets/rental-v2.js; then
            echo "Katalog-, Anfrage- und Size-UX bereits im auditierten Quellstand vorhanden."
          else
            python scripts/apply_catalog_inquiry_ux.py
          fi

      - name: Kompakten Mobile-Filter anwenden
        run: python scripts/apply_catalog_filter_mobile_ux.py

      - name: Quality-95-Polish anwenden
        run: python scripts/apply_quality_95_polish.py

      - name: Audit-Perfection anwenden
        run: python scripts/apply_audit_perfection.py

      - name: Taxonomie-Subtype-Audit anwenden
        run: python scripts/apply_taxonomy_subtype_fix.py

      - name: Runtime-Rental-Integritaet anwenden
        run: python scripts/apply_runtime_rental_integrity.py

      - name: Rental-Terms von Legacy-Runtime entkoppeln
        run: python scripts/apply_rental_terms_runtime_anchor.py

      - name: Admin-Datenqualitaetszentrale anwenden
        run: python scripts/apply_admin_quality_center.py

      - name: Admin-Datenqualitaetszentrale haerten
        run: python scripts/apply_admin_quality_hardening.py

      - name: Browser-entdeckte Runtime-Fehler reparieren
        run: python scripts/apply_browser_runtime_fixes.py

      - name: Adversarial entdeckte Runtime-Fehler reparieren
        run: python scripts/apply_adversarial_runtime_fixes.py

      - name: Gemessene Performance-/A11y-Qualitaet anwenden
        run: python scripts/apply_perf_a11y_quality.py

      - name: Focus-3 Mobile/Data Hardening anwenden
        run: python scripts/apply_focus_three_hardening.py

      - name: Smartphone-App/PWA anwenden
        run: python scripts/apply_pwa.py

      - name: JavaScript Syntax pruefen
        run: |
          node --check assets/app.js
          node --check assets/article.js
          node --check assets/catalog-filter-simplify.js
          node --check assets/rental-v2.js
          node --check assets/rental-v2-ui.js
          node --check assets/rental-v2-picker.js
          node --check assets/pwa.js
          node --check sw.js
          node --check shop-worker/commerce-core.js
          node --check shop-worker/worker.js
          node --check shop-worker/admin-api.js
          node --check shop-worker/admin-insights.js
          node --check shop-worker/admin-commerce-metrics.js
          node --check shop-worker/admin-rental-groups.js
          node --check shop-worker/admin-cases.js
          node --check shop-worker/admin-alerts.js
          node --check shop-worker/operations-monitor.js
          node --check shop-worker/admin-system.js
          node --check shop-worker/rental-bundle.js
          node --check shop-worker/worker-entry.js
          node --check shop-worker/offene-halte.js
          node --check shop-worker/kontingent.js

      - name: Archiv-Taxonomie-Filter pruefen
        run: python scripts/validate_archive_taxonomy_filters.py

      - name: Live-Katalog-Polish pruefen
        run: python scripts/validate_live_catalog_polish.py

      - name: Besucherquellen und Zugriffsschutz prüfen
        run: node --test shop-worker/besucher.test.mjs scripts/test_besucher_foreground.cjs

      - name: Commerce Unit Tests
        run: node --test shop-worker/commerce-core.test.mjs shop-worker/admin-api.test.mjs shop-worker/admin-insights.test.mjs shop-worker/admin-commerce-metrics.test.mjs shop-worker/admin-cases.test.mjs shop-worker/operations-monitor.test.mjs shop-worker/admin-system.test.mjs shop-worker/kontingent.test.mjs shop-worker/offene-halte.test.mjs shop-worker/oeffentlicher-katalog.test.mjs

      - name: D1-Migrationskette ausfuehren
        run: |
          python scripts/test_d1_migrations.py
          python scripts/test_backend_hardening_migration.py
          python scripts/test_main_provenance.py

      - name: Katalog-Taxonomie auf Quelldaten anwenden
        run: python scripts/apply_catalog_taxonomy.py

      - name: Seite bauen
        run: python build_site.py

      - name: Mietbedingungen anwenden
        run: python scripts/apply_rental_terms.py

      - name: Rental V2 einbinden
        run: python scripts/inject_rental_v2.py

      - name: Vereinfachte Archivfilter einbinden
        run: python scripts/inject_catalog_filter_simplify.py

      - name: Katalog-Taxonomie in Browserdaten und Produktseiten uebernehmen
        run: python scripts/apply_catalog_taxonomy.py --generated-only

      - name: Oeffentliche Produktseiten reparieren und DRAFT isolieren
        run: python scripts/repair_public_article_integrity.py

      - name: Crawlbare Katalogseiten und Sprachmetadaten pruefen
        run: python scripts/validate_seo_catalog.py

      - name: Smartphone-App/PWA pruefen
        run: python scripts/validate_pwa.py

      - name: Katalog-Taxonomie fuer jeden Artikel pruefen
        run: python scripts/validate_catalog_taxonomy.py

      - name: Taxonomie-Subtype-Audit pruefen
        run: python scripts/validate_taxonomy_subtypes.py

      - name: Vereinfachte Archivfilter pruefen
        run: python scripts/validate_catalog_filter_simplify.py

      - name: Katalog-, Anfrage- und Size-Regressionen pruefen
        run: python scripts/validate_catalog_inquiry_ux.py

      - name: Quality-95-Regressionen pruefen
        run: python scripts/validate_quality_95_polish.py

      - name: Performance-/A11y-Invarianten pruefen
        run: python scripts/validate_perf_a11y_quality.py

      - name: Focus-3 Mobile und Produktdaten >9 pruefen
        run: python scripts/validate_focus_three.py

      - name: Hover-Bild der Katalogkacheln pruefen
        run: python scripts/validate_katalog_hover.py

      - name: Audit Zero-Hit-Facets pruefen
        run: python scripts/validate_audit_perfection.py --section facets

      - name: Audit Single-Rental-V2 pruefen
        run: python scripts/validate_audit_perfection.py --section rental

      - name: Audit Kaufanfragen pruefen
        run: python scripts/validate_audit_perfection.py --section purchase

      - name: Audit Taxonomie-Kategorien pruefen
        run: python scripts/validate_audit_perfection.py --section taxonomy-categories

      - name: Audit Taxonomie-Abweichungen pruefen
        run: python scripts/validate_audit_perfection.py --section taxonomy-mismatches

      - name: Audit Taxonomie-Produktseiten pruefen
        run: python scripts/validate_audit_perfection.py --section taxonomy-pages

      - name: Audit Datenqualitaet pruefen
        run: python scripts/validate_audit_perfection.py --section quality

      - name: Shop, SEO, Katalog und geschuetzte Modi pruefen
        run: python scripts/validate_shop.py

      - name: Artikelnummern-URLs und alte Produktverweise pruefen
        run: |
          python scripts/test_catalog_number_urls.py
          node --test shop-worker/storefront-edge.test.mjs

      - name: Commerce-, Mietpreis- und Security-Invarianten pruefen
        run: python scripts/validate_commerce.py

      - name: Rental-Frontend pruefen
        run: python scripts/validate_rental_frontend.py

      - name: Single Runtime-Rental pruefen
        run: python scripts/validate_runtime_rental_integrity.py

      - name: Admin-Datenqualitaetszentrale pruefen
        run: python scripts/validate_admin_quality_center.py

      - name: D1 State- und Mietpreis-Integritaet pruefen
        run: python scripts/validate_state_integrity.py

      - name: Admin-Operations-D1 pruefen
        run: python scripts/validate_admin_operations.py

      - name: Atomic Rental Bundle pruefen
        run: python scripts/validate_rental_bundle.py

      - name: Validierten Rebuild-Patch vorbereiten
        run: |
          git add -A
          git diff --cached --binary > rebuild.patch
          git reset

      - name: Validierten Rebuild-Patch sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disorder119-rebuild-patch-${{ github.run_id }}
          path: rebuild.patch
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Exakt vorbereiteten Shop im Browser pruefen
    needs: rebuild
    uses: ./.github/workflows/browser-smoke.yml
    with:
      rebuild_patch_artifact: disorder119-rebuild-patch-${{ github.run_id }}
    permissions:
      contents: read

  security:
    name: Exakt vorbereiteten Shop auf Sicherheit pruefen
    needs: rebuild
    uses: ./.github/workflows/security-gate.yml
    with:
      rebuild_patch_artifact: disorder119-rebuild-patch-${{ github.run_id }}
    permissions:
      contents: read

  publish:
    name: Validierten Main-Rebuild publizieren
    needs: [rebuild, quality, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    permissions:
      contents: write
    steps:
      - name: Exakt validierten Main-Stand auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validierten Rebuild-Patch laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: disorder119-rebuild-patch-${{ github.run_id }}
          path: .

      - name: Nur validierten Output nach main schreiben
        id: publish
        run: |
          set -euo pipefail
          test -f rebuild.patch
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo "Main wurde inzwischen geaendert; veralteten Rebuild nicht publizieren."
            exit 0
          fi
          if [ -s rebuild.patch ]; then
            git apply --index --binary rebuild.patch
            if ! git diff --cached --quiet; then
              git config user.name "disorder119-bot"
              git config user.email "actions@users.noreply.github.com"
              git commit -m "Automatischer Rebuild nach Shop- und SEO-Validierung"
              git push origin HEAD:main
            fi
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-cloudflare:
    name: Geprueften Shop aus Cloudflare ausliefern
    needs: publish
    if: >-
      github.ref == 'refs/heads/main' && needs.publish.outputs.revision != '' &&
      vars.CLOUDFLARE_STOREFRONT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Server-enforced main-only branch policy protects the secret even if a
    # same-repository PR attempts to edit its workflow conditions.
    environment: storefront-production
    permissions:
      contents: read
    steps:
      - name: Exakt publizierten und validierten Git-Stand verwenden
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.publish.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fest verankerten Cloudflare-Client installieren
        run: npm ci --prefix tools/storefront-publish --ignore-scripts --no-audit --no-fund
      - name: Nur oeffentliche Git-Dateien exportieren und vorpruefen
        env:
          REVISION: ${{ needs.publish.outputs.revision }}
          # Geo-Sperre (shop-worker/geo-sperre.js): Repository-Variablen, leer = RU,BY,IN,KP,IR.
          GEO_SPERRE_LAENDER: ${{ vars.GEO_SPERRE_LAENDER }}
          GEO_SPERRE_KONTINENTE: ${{ vars.GEO_SPERRE_KONTINENTE }}
        run: python scripts/publish_storefront.py --revision "$REVISION"
      - name: Bestehenden Storefront-Worker aktualisieren und Ergebnis gegenpruefen
        env:
          REVISION: ${{ needs.publish.outputs.revision }}
          GEO_SPERRE_LAENDER: ${{ vars.GEO_SPERRE_LAENDER }}
          GEO_SPERRE_KONTINENTE: ${{ vars.GEO_SPERRE_KONTINENTE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STOREFRONT_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare-Publikationsfreigabe fehlt."; exit 1; }
          python scripts/publish_storefront.py --revision "$REVISION" --activate
      - name: Publikationsnachweis ohne Zugangsdaten sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storefront-deployment-${{ github.run_id }}
          path: .storefront-build/deployment.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
