name: Seite automatisch neu bauen

# Baut die statischen Seiten aus data/items.json und den Quelltemplates neu.
# Professional-Shop-Pass: harte Validierung vor jedem Commit. Match, Chaos
# und Baukasten werden ueber config/mode-guard.json gegen unbeabsichtigte
# Aenderungen geschuetzt.

on:
  push:
    branches: [main, professional-shop-pass]
    paths:
      - "data/items.json"
      - "index_template.html"
      - "build_site.py"
      - "config/shop-config.json"
      - "config/mode-guard.json"
      - "assets/app.js"
      - "assets/app.css"
      - "assets/article.js"
      - "assets/article.css"
      - "shop-worker/**"
      - "scripts/**"
      - ".github/workflows/rebuild.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Abhaengigkeiten installieren
        run: pip install pillow

      - name: Einmaligen Professional-Shop-Patch anwenden
        if: hashFiles('scripts/pro_shop_upgrade_once.py') != ''
        run: python scripts/pro_shop_upgrade_once.py

      - name: Validierungsregeln fuer Altbestand aktualisieren
        if: hashFiles('scripts/validate_shop_fix_once.py') != ''
        run: python scripts/validate_shop_fix_once.py

      - name: Python Syntax pruefen
        run: python -m py_compile build_site.py scripts/*.py

      - name: JavaScript Syntax pruefen
        run: |
          node --check assets/app.js
          node --check assets/article.js
          node --check shop-worker/worker.js

      - name: Seite bauen
        run: python build_site.py

      - name: Mode-Guard initialisieren falls noch nicht vorhanden
        run: |
          if [ ! -f config/mode-guard.json ]; then
            python scripts/validate_shop.py --init-mode-guard
          fi

      - name: Shop, Katalog und geschuetzte Modi pruefen
        run: python scripts/validate_shop.py

      - name: Ergebnis committen
        run: |
          git config user.name "disorder119-bot"
          git config user.email "actions@users.noreply.github.com"
          git add build_site.py assets/article.js shop-worker/worker.js scripts/validate_shop.py config/mode-guard.json data/shop-quality.json
          git add index.html artikel sitemap.xml cart impressum agb datenschutz ueber-uns faq match chaos baukasten en fr data/catalog.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen am generierten Output - nichts zu committen."
          else
            git commit -m "Professional-Shop-Pass anwenden und validieren"
            git push
          fi
