name: Seite automatisch neu bauen

# Baut index.html / artikel/*.html / sitemap.xml aus data/items.json +
# index_template.html neu und haelt die vertrauensbildenden Shoptexte in der
# zentralen Build-Quelle konsistent. Das Design/CSS wird dabei nicht geaendert.

on:
  push:
    branches: [main]
    paths:
      - "data/items.json"
      - "index_template.html"
      - "build_site.py"
      - "scripts/trust_upgrade.py"
      - ".github/workflows/rebuild.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install pillow

      - name: Vertrauen und Shop-Klarheit aktualisieren
        run: python scripts/trust_upgrade.py

      - name: Seite bauen
        run: python build_site.py

      - name: Ergebnis committen
        run: |
          git config user.name "disorder119-bot"
          git config user.email "actions@users.noreply.github.com"
          git add build_site.py assets/app.js index.html artikel sitemap.xml cart impressum agb datenschutz ueber-uns faq match chaos baukasten en fr data/catalog.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen am generierten Output - nichts zu committen."
          else
            git commit -m "Trust und Shop-Klarheit verbessern"
            git push
          fi
