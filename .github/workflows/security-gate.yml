name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Getrackte Secrets blockieren
        run: python scripts/security_scan.py

      - name: Security-Code Syntax pruefen
        run: |
          python -m py_compile scripts/security_scan.py scripts/universe_regression.py
          node --check shop-worker/notifications.js
          node --check shop-worker/worker-entry.js
          node --check shop-worker/backend-runtime.js
          node --check shop-worker/worker.js
          node --check shop-worker/game-rewards.js
          node --check shop-worker/coupon-checkout.js
          node --check shop-worker/customer-mail.js
          node --check shop-worker/customer-account.js
          node --check shop-worker/buchhaltung.js
          node --check shop-worker/dhl.js
          node --check shop-worker/dhl-qr.js
          node --check shop-worker/admin-passkeys.js
          node --check shop-worker/admin-katalog.js
          node --check shop-worker/github-datei.js
          node --check assets/ios-zoom-lock.js
          node --check assets/universe-upgrade.js
          node --check assets/zero-g-runway.js
          node --check assets/secret-games.js
          node --check assets/shop-promos.js

      - name: Benachrichtigungs-Regressionen pruefen
        run: node --test shop-worker/notifications.test.mjs shop-worker/admin-notifications.test.mjs shop-worker/customer-mail.test.mjs shop-worker/customer-account.test.mjs

      - name: Game- und Gutschein-Regressionen pruefen
        run: node --test shop-worker/game-rewards.test.mjs shop-worker/coupon-checkout.test.mjs shop-worker/buchhaltung.test.mjs shop-worker/dhl.test.mjs

      - name: Admin-Anmeldung, QR-Versand und Katalog pruefen
        run: node --test shop-worker/admin-passkeys.test.mjs shop-worker/dhl-qr.test.mjs shop-worker/admin-katalog.test.mjs

      - name: Gutschein-Migration pruefen
        run: |
          {
            echo "CREATE TABLE commerce_orders (id TEXT PRIMARY KEY, status TEXT NOT NULL);"
            cat shop-worker/migrations/0009_secret_games.sql
            cat shop-worker/migrations/0010_coupon_checkout.sql
          } | sqlite3 :memory:

      - name: Universum-Mobile-Regressionen pruefen
        run: python scripts/universe_regression.py
