name: Browser Smoke & Navigation

on:
  pull_request:
    branches: [main]
    paths:
      - "data/items.json"
      - "index_template.html"
      - "build_site.py"
      - "admin/index.html"
      - "config/shop-config.json"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "data/items.json"
      - "index_template.html"
      - "build_site.py"
      - "admin/index.html"
      - "config/shop-config.json"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testabhaengigkeiten installieren
        run: |
          pip install pillow selenium
          npm install --no-save --package-lock=false lighthouse@12 axe-core@4

      - name: Quellen wie im Produktions-Rebuild vorbereiten
        run: |
          python scripts/repair_catalog_source_integrity.py
          if grep -q 'id="filterDepartment"' index_template.html \
             && grep -q 'id="filterProductType"' index_template.html \
             && grep -q 'var DEPARTMENT_LABELS = {' assets/app.js \
             && grep -q 'it.taxonomy_category || it.category' assets/app.js; then
            echo "Archiv-Taxonomie-Filter bereits vorhanden."
          else
            python scripts/apply_archive_taxonomy_filters.py
          fi
          if grep -q 'AUDIT_PERFECT_NATIVE_FACETS' assets/app.js \
             && grep -q 'function renderActiveFilters()' assets/app.js \
             && grep -q 'id="activeFilters"' index_template.html; then
            echo "Archiv-Filter-UX bereits vorhanden."
          else
            python scripts/apply_archive_filter_ux.py
          fi
          python scripts/apply_archive_filter_bugfixes.py
          python scripts/apply_live_catalog_polish.py
          if grep -q 'it.size_normalized, it.article, String(it.id || "")' assets/app.js \
             && grep -q 'class="plate__size"' assets/app.js \
             && grep -q 'item.article, item.id, itemCategory(item), item.size' assets/rental-v2-picker.js; then
            echo "Katalog-/Inquiry-UX bereits vorhanden."
          else
            python scripts/apply_catalog_inquiry_ux.py
          fi
          python scripts/apply_catalog_filter_mobile_ux.py
          python scripts/apply_quality_95_polish.py
          python scripts/apply_audit_perfection.py
          python scripts/apply_taxonomy_subtype_fix.py
          python scripts/apply_runtime_rental_integrity.py
          python scripts/apply_rental_terms_runtime_anchor.py
          python scripts/apply_admin_quality_center.py
          python scripts/apply_admin_quality_hardening.py
          python scripts/apply_browser_runtime_fixes.py
          python scripts/apply_adversarial_runtime_fixes.py

      - name: Browser-Build erzeugen
        run: |
          python scripts/apply_catalog_taxonomy.py
          python build_site.py
          python scripts/apply_rental_terms.py
          python scripts/inject_rental_v2.py
          python scripts/inject_catalog_filter_simplify.py
          python scripts/apply_catalog_taxonomy.py --generated-only
          python scripts/repair_public_article_integrity.py

      - name: Lokale Navigation und Assets pruefen
        run: python scripts/validate_local_navigation.py

      - name: Chrome verfuegbar
        run: google-chrome --version

      - name: Echte Browser-Kundenwege pruefen
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/d119-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          D119_SMOKE_URL=http://127.0.0.1:4173 python scripts/browser_smoke.py
          D119_SMOKE_URL=http://127.0.0.1:4173 python scripts/browser_protected_modes_smoke.py
          D119_SMOKE_URL=http://127.0.0.1:4173 python scripts/browser_adversarial_stress.py

      - name: Lighthouse- und WCAG-Budgets pruefen
        id: quality_budget
        continue-on-error: true
        run: |
          rm -rf .quality-reports
          python -m http.server 4174 --bind 127.0.0.1 > /tmp/d119-quality-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4174/ >/dev/null && break
            sleep 0.25
          done
          D119_SMOKE_URL=http://127.0.0.1:4174 python scripts/browser_quality_budget.py

      - name: Quality-Audit-Zusammenfassung anzeigen
        if: always()
        run: |
          if [ -f .quality-reports/summary.md ]; then
            cat .quality-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Disorder119 Performance & Accessibility Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "Audit-Summary wurde nicht erzeugt." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Quality-Audit im Pull Request aktualisieren
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: .quality-reports/summary.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- d119-quality-audit -->';
            let summary = '## Disorder119 Performance & Accessibility Audit\n\nAudit-Summary wurde nicht erzeugt.';
            if (fs.existsSync(process.env.SUMMARY_PATH)) {
              summary = fs.readFileSync(process.env.SUMMARY_PATH, 'utf8');
            }
            const body = `${marker}\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user && comment.user.type === 'Bot' && typeof comment.body === 'string' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Quality-Audit-Berichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disorder119-browser-quality-${{ github.run_id }}
          path: .quality-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Quality-Budget als Gate abschliessen
        if: always() && steps.quality_budget.outcome == 'failure'
        run: |
          echo "Lighthouse-/WCAG-Budget wurde verletzt. Details stehen im Audit-Summary und Artefakt."
          exit 1
