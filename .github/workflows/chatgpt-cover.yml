name: ChatGPT Notebook Cover Build

on:
  push:
    branches:
      - chatgpt-notebook-cover-20260920
    paths:
      - "tools/chatgpt_cover_build.py"
      - ".github/workflows/chatgpt-cover.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install pillow qrcode reportlab

      - name: Build cover from actual repository catalogue assets
        run: python tools/chatgpt_cover_build.py

      - name: Upload print files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disorder119-a5-notebook-cover-original-products
          path: |
            out/Disorder119_A5_Hardcover_Originalprodukte_344.5x245mm_300dpi.png
            out/Disorder119_A5_Hardcover_Originalprodukte_344.5x245mm_Print.pdf
            out/Disorder119_A5_Hardcover_Originalprodukte_preview.png
            out/Disorder119_A5_Hardcover_Originalprodukte_manifest.txt
          if-no-files-found: error
          retention-days: 7
