name: ChatGPT Notebook Color V13

on:
  push:
    branches:
      - chatgpt-notebook-color-v13-20260921
    paths:
      - "tools/build_notebook_color_v13.py"
      - ".github/workflows/chatgpt-notebook-color-v13.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install pillow qrcode
      - run: python tools/build_notebook_color_v13.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disorder119-notebook-color-v13
          path: out_v13/
          if-no-files-found: error
          retention-days: 7
