name: ChatGPT Display Asset Audit
on:
  push:
    branches: [chatgpt-notebook-display-audit-20260920]
    paths: ["tools/audit_display_assets.py", ".github/workflows/chatgpt-display-audit.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python tools/audit_display_assets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disorder119-display-audit
          path: out_display_audit/*
          if-no-files-found: error
          retention-days: 2
