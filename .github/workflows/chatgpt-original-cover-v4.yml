name: ChatGPT Original Asset Cover V4

on:
  push:
    branches:
      - chatgpt-original-assets-cover-v4-20260920
    paths:
      - "tools/build_original_asset_cover_v4.py"
      - ".github/workflows/chatgpt-original-cover-v4.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pillow qrcode
      - name: Build covers from current original shop assets
        run: python tools/build_original_asset_cover_v4.py
      - name: Upload PNG previews and print-size PNGs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disorder119-original-cover-v4
          path: out_original_cover_v4/*
          if-no-files-found: error
          retention-days: 7
