name: Main Integrity Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Ein Push mit "[skip ci]" (oder [ci skip], [no ci], [skip actions]) im
  # Commit startet KEINEN push-Workflow. Der geplante Lauf liest deshalb alle
  # 15 Minuten die Push-Aktivitaet von main nach und prueft sie genauso.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      heal_before: ${{ steps.pruefung.outputs.heal_before }}
      heal_after: ${{ steps.pruefung.outputs.heal_after }}
    steps:
      - name: Pull requests are the approved change path
        if: github.event_name == 'pull_request'
        run: echo "PR path detected — provenance OK."

      - name: Pruefskript aus dem vertrauten Stand holen
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Jeder Commit von before bis sha muss belegt sein: gemergter PR nach
      # main, die Automatik dieses Repos (Pusher github-actions[bot] - nicht
      # Name/E-Mail im Commit, die frei waehlbar sind) oder ein Shop-Verkauf
      # des Eigentuemers (nur Statuszeilen eines Artikels). Die Logik steht in
      # scripts/main_provenance.py (Tests: scripts/test_main_provenance.py);
      # bei push kommt das Skript aus dem Stand VOR dem Push, damit ein Push
      # seine eigene Pruefung nicht aendern kann. Verzoegert indexierte
      # PR-Zuordnung meldet es als "PR provenance noch nicht indexiert" und
      # wiederholt die Abfrage bis zu 12-mal. API-Fehler machen den Lauf rot,
      # loesen aber keinen Revert aus.
      - name: Main push must come from a merged PR or trusted automation
        id: pruefung
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PUSHER: ${{ github.actor }}
          MODUS: ${{ github.event_name == 'push' && 'push' || 'audit' }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/main_provenance.py ]; then
            # Erster Lauf nach Einfuehrung des Skripts: Stand vor dem Push kennt es noch nicht.
            git fetch --depth=1 origin "${GITHUB_SHA}"
            git checkout -q FETCH_HEAD -- scripts/main_provenance.py
          fi
          if [ "$MODUS" = "push" ]; then
            python scripts/main_provenance.py
          else
            python scripts/main_provenance.py --audit --stunden 3
          fi

  production-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Critical ownership, least privilege and immutable actions must hold
        run: |
          set -euo pipefail
          test -s .github/CODEOWNERS
          test -s config/mode-guard.json
          test -s .github/workflows/rebuild.yml
          test -s .github/workflows/browser-smoke.yml
          test -s .github/workflows/main-integrity.yml
          grep -q '@disorder119' .github/CODEOWNERS
          grep -q 'Main Integrity Guard' .github/workflows/main-integrity.yml
          grep -q 'Validierten Main-Rebuild publizieren' .github/workflows/rebuild.yml
          grep -q 'contents: read' .github/workflows/rebuild.yml
          grep -q 'contents: write' .github/workflows/rebuild.yml
          grep -q 'Automatischer Schutz-Revert' .github/workflows/main-integrity.yml
          grep -q 'PR provenance noch nicht indexiert' .github/workflows/main-integrity.yml
          if grep -REn 'uses:[[:space:]]+[^[:space:]]+@v[0-9]' .github/workflows; then
            echo "Unverankerte Action-Version gefunden. Produktions-Actions muessen auf Commit-SHAs gepinnt sein."
            exit 1
          fi

  # Zurueckgedreht wird nur der gemeldete unbelegte Push - im geplanten Lauf
  # nur, wenn er noch die Spitze von main ist (sonst bleibt der Lauf rot und
  # GitHub meldet den Fehlschlag per Mail).
  self-heal:
    name: Unautorisierten Main-Push automatisch neutralisieren
    needs: provenance
    if: always() && github.event_name != 'pull_request' && needs.provenance.result == 'failure' && needs.provenance.outputs.heal_after != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Unautorisierten Stand auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.provenance.outputs.heal_after }}
          fetch-depth: 0

      - name: Vorherigen Main-Baum als Schutz-Revert wiederherstellen
        env:
          BEFORE: ${{ needs.provenance.outputs.heal_before }}
          AFTER: ${{ needs.provenance.outputs.heal_after }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$AFTER" ]; then
            echo "main ist seit dem unbelegten Push weitergelaufen; kein automatischer Revert (bitte von Hand pruefen)."
            exit 1
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Kein sicherer vorheriger main-Commit vorhanden; automatischer Revert verweigert."
            exit 1
          fi
          git fetch origin "$BEFORE" --depth=1
          git read-tree --reset -u "$BEFORE"
          if git diff --cached --quiet; then
            echo "Der unautorisierte Push hat keinen Baum-Unterschied hinterlassen."
            exit 0
          fi
          git config user.name "disorder119-guard"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Automatischer Schutz-Revert eines unautorisierten main-Push"
          # Kein Force-Push: falls main inzwischen legitim weitergelaufen ist,
          # wird der Push sicher abgelehnt statt neuere Arbeit zu ueberschreiben.
          git push origin HEAD:main
