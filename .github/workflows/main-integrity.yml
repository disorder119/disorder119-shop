name: Main Integrity Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull requests are the approved change path
        if: github.event_name == 'pull_request'
        run: echo "PR path detected — provenance OK."

      - name: Main push must come from a merged PR or rebuild bot
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$COMMIT_AUTHOR" = "disorder119-bot" ] && [[ "$COMMIT_MESSAGE" == "Automatischer Rebuild nach Shop- und SEO-Validierung"* ]]; then
            echo "Validated rebuild-bot commit — provenance OK."
            exit 0
          fi

          response="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/commits/$SHA/pulls")"

          python - "$response" <<'PY'
          import json, sys
          prs = json.loads(sys.argv[1])
          approved = [
              pr for pr in prs
              if pr.get("merged_at") and (pr.get("base") or {}).get("ref") == "main"
          ]
          if not approved:
              raise SystemExit(
                  "DIRECT PUSH BLOCKED BY POLICY: this main commit is not associated "
                  "with a merged pull request and is not the validated rebuild bot."
              )
          print("Merged PR provenance OK:", ", ".join("#" + str(pr["number"]) for pr in approved))
          PY

  production-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Critical ownership and guard files must exist
        run: |
          test -s .github/CODEOWNERS
          test -s config/mode-guard.json
          test -s .github/workflows/rebuild.yml
          test -s .github/workflows/browser-smoke.yml
          grep -q '@disorder119' .github/CODEOWNERS
          grep -q 'Main Integrity Guard' .github/workflows/main-integrity.yml
