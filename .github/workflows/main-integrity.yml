name: Main Integrity Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull requests are the approved change path
        if: github.event_name == 'pull_request'
        run: echo "PR path detected — provenance OK."

      # Der Pruefer fuer Verkaufsbuchungen kommt aus dem VORHERIGEN main-Stand,
      # nie aus dem gepushten Commit: sonst koennte ein Push seinen eigenen
      # Pruefer mitbringen.
      # Beide Zusatzschritte duerfen den Job nie scheitern lassen: sie koennen
      # die Verkaufs-Ausnahme nur gewaehren oder verweigern, die normale
      # Herkunftspruefung fuer gemergte PRs laeuft unveraendert danach.
      - name: Vertrauenswuerdigen Main-Stand fuer Verkaufspruefung auschecken
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.before }}
          path: trusted
          persist-credentials: false

      - name: Verkaufsbuchung des Shop-Workers inhaltlich pruefen
        id: sale
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Nur Pushes, deren letzter Commit exakt "Verkauft: Artikel <id>" heisst,
          # kommen fuer diese Ausnahme ueberhaupt in Frage. Alles Weitere prueft
          # scripts/verify_sale_commit.py ueber den gesamten Push.
          message="$(printf '%s' "$HEAD_MESSAGE" | sed -e 's/[[:space:]]*$//')"
          if [[ ! "$message" =~ ^Verkauft:\ Artikel\ [0-9]+$ ]]; then
            echo "Kein Verkaufs-Commit - normale Herkunftspruefung."
            exit 0
          fi
          if [ ! -f trusted/scripts/verify_sale_commit.py ]; then
            echo "Pruefer im vorherigen main-Stand nicht vorhanden - keine Ausnahme."
            exit 0
          fi
          work="${RUNNER_TEMP:-/tmp}/sale-check"
          mkdir -p "$work"
          api() {
            curl -fsSL --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }
          api -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/compare/$BEFORE...$SHA" -o "$work/compare.json"
          api -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$REPO/contents/data/items.json?ref=$BEFORE" -o "$work/before.json"
          api -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$REPO/contents/data/items.json?ref=$SHA" -o "$work/after.json"
          if python trusted/scripts/verify_sale_commit.py "$work/compare.json" "$work/before.json" "$work/after.json"; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Main push must come from a merged PR or trusted automation
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SALE_VERIFIED: ${{ steps.sale.outputs.verified }}
        run: |
          set -euo pipefail
          # Die Antwort enthaelt die vollstaendige Dateiliste des Commits samt
          # Diffs. Als Kommandozeilenargument sprengt sie bei groesseren
          # Commits das Kernel-Limit fuer ein einzelnes Argument: python
          # startet dann gar nicht ("Argument list too long", exit 126), der
          # Schritt gilt als fehlgeschlagen, und der Self-Heal-Job macht einen
          # regulaer gemergten Pull Request rueckgaengig. Gemessen am
          # 2026-09-16: 120114 Bytes bestanden, 123889 Bytes scheiterten -
          # rund 150 geaenderte Dateien reichen also schon. Deshalb landen
          # beide Antworten in Dateien und werden von dort gelesen. Die
          # Pruefung selbst bleibt unveraendert.
          commit_json_file="${RUNNER_TEMP:-/tmp}/provenance-commit.json"
          prs_json_file="${RUNNER_TEMP:-/tmp}/provenance-pulls.json"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/commits/$SHA" -o "$commit_json_file"

          # GitHub can expose a freshly squash-merged commit before the
          # commit->pulls association has finished indexing. Retry that one
          # eventual-consistency edge instead of self-healing a legitimate PR.
          echo "[]" > "$prs_json_file"
          for attempt in $(seq 1 12); do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/commits/$SHA/pulls" -o "$prs_json_file"
            if python - "$prs_json_file" "$SHA" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              prs = json.load(fh)
          sha = sys.argv[2]
          approved = [
              pr for pr in prs
              if pr.get("merged_at")
              and (pr.get("base") or {}).get("ref") == "main"
              and pr.get("merge_commit_sha") == sha
          ]
          raise SystemExit(0 if approved else 1)
          PY
            then
              break
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "PR provenance noch nicht indexiert (Versuch $attempt/12); erneuter Check in 5s."
              sleep 5
            fi
          done

          python - "$commit_json_file" "$prs_json_file" "$SHA" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              commit = json.load(fh)
          with open(sys.argv[2], encoding="utf-8") as fh:
              prs = json.load(fh)
          sha = sys.argv[3]
          approved_prs = [
              pr for pr in prs
              if pr.get("merged_at")
              and (pr.get("base") or {}).get("ref") == "main"
              and pr.get("merge_commit_sha") == sha
          ]
          if approved_prs:
              print("Merged PR provenance OK:", ", ".join("#" + str(pr["number"]) for pr in approved_prs))
              raise SystemExit(0)

          raw = commit.get("commit") or {}
          author = raw.get("author") or {}
          github_author = (commit.get("author") or {}).get("login")
          name = author.get("name") or ""
          message = raw.get("message") or ""
          trusted_actions_identity = github_author == "actions"

          if (trusted_actions_identity and name == "disorder119-bot" and
                  message.startswith("Automatischer Rebuild nach Shop- und SEO-Validierung")):
              print("Validated rebuild automation provenance OK.")
              raise SystemExit(0)
          if (trusted_actions_identity and name == "disorder119-guard" and
                  message.startswith("Automatischer Schutz-Revert eines unautorisierten main-Push")):
              print("Main guard self-heal provenance OK.")
              raise SystemExit(0)
          # Verkaufsbuchung des Shop-Workers: im Schritt davor inhaltlich ueber den
          # ganzen Push geprueft (nur data/items.json, nur SOLD-Markierung der
          # genannten Artikel), mit dem Pruefer aus dem vorherigen main-Stand.
          if os.environ.get("SALE_VERIFIED") == "true":
              print("Content-verified shop worker sale provenance OK.")
              raise SystemExit(0)

          raise SystemExit(
              "UNAUTHORIZED MAIN PUSH: commit is neither a merged PR nor a trusted GitHub Actions rebuild/guard commit."
          )
          PY

  production-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Critical ownership, least privilege and immutable actions must hold
        run: |
          set -euo pipefail
          test -s .github/CODEOWNERS
          test -s config/mode-guard.json
          test -s .github/workflows/rebuild.yml
          test -s .github/workflows/browser-smoke.yml
          test -s .github/workflows/main-integrity.yml
          grep -q '@disorder119' .github/CODEOWNERS
          grep -q 'Main Integrity Guard' .github/workflows/main-integrity.yml
          grep -q 'Validierten Main-Rebuild publizieren' .github/workflows/rebuild.yml
          grep -q 'contents: read' .github/workflows/rebuild.yml
          grep -q 'contents: write' .github/workflows/rebuild.yml
          grep -q 'Automatischer Schutz-Revert' .github/workflows/main-integrity.yml
          grep -q 'PR provenance noch nicht indexiert' .github/workflows/main-integrity.yml
          if grep -REn 'uses:[[:space:]]+[^[:space:]]+@v[0-9]' .github/workflows; then
            echo "Unverankerte Action-Version gefunden. Produktions-Actions muessen auf Commit-SHAs gepinnt sein."
            exit 1
          fi

  self-heal:
    name: Unautorisierten Main-Push automatisch neutralisieren
    needs: provenance
    if: always() && github.event_name == 'push' && needs.provenance.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Unautorisierten Stand auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Vorherigen Main-Baum als Schutz-Revert wiederherstellen
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Kein sicherer vorheriger main-Commit vorhanden; automatischer Revert verweigert."
            exit 1
          fi
          git fetch origin "$BEFORE" --depth=1
          git read-tree --reset -u "$BEFORE"
          if git diff --cached --quiet; then
            echo "Der unautorisierte Push hat keinen Baum-Unterschied hinterlassen."
            exit 0
          fi
          git config user.name "disorder119-guard"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Automatischer Schutz-Revert eines unautorisierten main-Push"
          # Kein Force-Push: falls main inzwischen legitim weitergelaufen ist,
          # wird der Push sicher abgelehnt statt neuere Arbeit zu ueberschreiben.
          git push origin HEAD:main
