# Dependabot haelt die GitHub Actions aktuell. Alle Actions sind auf Commit-SHAs
# gepinnt (main-integrity.yml prueft das); Dependabot aktualisiert die SHA samt
# Versionskommentar und schlaegt das als Pull Request vor - gemergt wird nur
# nach denselben Pruefungen wie jede andere Aenderung.
#
# Achtung: scripts/validate_focus_three.py verlangt fuer checkout, setup-python
# und setup-node genau die heute auditierten SHAs. Ein Dependabot-PR fuer diese
# drei Actions muss die erwarteten SHAs dort mit anheben.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
