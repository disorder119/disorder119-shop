name = "disorder119-storefront-security"
main = "storefront-assets.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "disorder119.com/*", zone_name = "disorder119.com" },
  { pattern = "www.disorder119.com/*", zone_name = "disorder119.com" }
]

# Only the pinned, allowlisted public export belongs in this directory.
# run_worker_first keeps every path and catalog behind the existing guard.
[assets]
directory = "../.storefront-build/public"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# Anonyme Besuchszaehlung (storefront-edge.js): echte Seitenaufrufe gehen
# ueber diese Dienstbindung an den Shop-Worker - ohne oeffentliche Adresse,
# ohne Geheimnis. Der Shop-Worker muss vor diesem Worker deployt sein.
[[services]]
binding = "BESUCH"
service = "disorder119-shop-worker"

[observability]
enabled = true
head_sampling_rate = 0.1
