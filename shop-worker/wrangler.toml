name = "disorder119-shop-worker"
main = "worker-entry.js"
compatibility_date = "2025-01-01"

# Nur ueber die eigene Adresse erreichbar. Cloudflare legt DNS-Eintrag und
# Zertifikat beim Deploy selbst an (die Zone disorder119.com muss aktiv sein).
# Die workers.dev-Adresse und Vorschau-Links bleiben aus: eine Tuer weniger.
routes = [{ pattern = "api.disorder119.com", custom_domain = true }]
workers_dev = false
preview_urls = false

# Alle echten Zugangsdaten sind Secrets (nie hier eintragen, nie committen) -
# siehe README.md fuer die genauen `wrangler secret put ...`-Befehle.

# Oeffentliche Einstellungen ohne Geheimnis.
# ADMIN_SESSION_HOURS: Eine Anmeldung in der Admin-App (Face ID / Windows
# Hello) haelt hoechstens 24 Stunden, auch fuer frueher laenger ausgestellte Sitzungen.
[vars]
ADMIN_SESSION_HOURS = "24"
# Echte Zahlungen: PayPal-Live-API, Turnstile und Ratenbegrenzer sind damit
# Pflicht (backend-runtime.js). Zurueck in den Testmodus: "sandbox".
PAYPAL_ENVIRONMENT = "live"
# DHL-Schluessel allein schaltet nicht auf Produktion. Labelkauf bleibt eine
# ausdrueckliche Admin-Aktion mit Zahlung im DHL-Frontend.
DHL_PRIVAT_ENVIRONMENT = "live"
# Geo-Sperre (geo-sperre.js): aus diesen Laendern ist die API gar nicht
# erreichbar (403). ISO-Codes mit Komma, "aus" schaltet ab; DE und US werden
# nie gesperrt. Optional GEO_SPERRE_KONTINENTE = "AS" fuer ganz Asien.
# Die Shop-Seite selbst (Storefront-Worker) liest dieselben Namen aus den
# GitHub-Repository-Variablen (rebuild.yml) - beide gleich halten.
GEO_SPERRE_LAENDER = "RU,BY,IN,KP,IR"

# Produktionsfehler muessen nachtraeglich ueber Request-ID und strukturierte Logs
# untersuchbar bleiben. Bei wachsendem Traffic kann die Sampling-Rate bewusst
# reduziert werden, ohne die Observability komplett abzuschalten.
# Hintergrundjobs (worker-entry.js, scheduled): Zahlungsabgleich und
# Reservierungsablauf, PayPal-Erstattungen, Betriebswarnungen, Aufraeumen der
# Besucherstatistik und die einmalige Apple-Pay-Domain bei PayPal. Sie laufen
# zusaetzlich beim Oeffnen der Admin-App; der Cron sorgt dafuer, dass sie auch
# ohne Admin-Besuch passieren.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# Ratenbegrenzer (RATE_LIMITER). Ohne ihn verweigert der Worker im
# Livebetrieb Kauf, Miete und Konto-Anmeldung (backend-runtime.js). Gezaehlt
# wird je Route und Anschluss: 20 Anfragen pro Minute reichen jedem Menschen
# und bremsen jedes Skript. namespace_id ist eine frei gewaehlte Zahl, die im
# Cloudflare-Konto nur einmal vorkommen darf.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1190"
simple = { limit = 20, period = 60 }

# Nur /rental-quote (oeffentlich, ohne Bot-Schutz), je Anschluss (IPv6 je /64).
# Das Mietfenster fragt je Stueck einmal (bis 20 Stuecke je Paket, bei jedem
# Datumswechsel) - dafuer reichen 60; den Katalog liest die Route aus dem
# Zwischenspeicher. Fehlt die Bindung, zaehlt RATE_LIMITER (worker.js).
[[ratelimits]]
name = "QUOTE_LIMITER"
namespace_id = "1192"
simple = { limit = 60, period = 60 }

# Waechter (waechter.js): ueber alle oeffentlichen API-Wege zusammen
# hoechstens 240 Anfragen je Anschluss und Minute (Admin, Manager und
# Webhooks zaehlen nicht). Darueber 429; wer das wiederholt, wird 24 h gesperrt.
[[ratelimits]]
name = "WAECHTER_LIMITER"
namespace_id = "1195"
simple = { limit = 240, period = 60 }

# Wecker fuer die Besuchs-Zusammenfassung (besucher-wecker.js): ein Durable
# Object mit SQLite-Speicher (kostenloser Plan) haelt den naechsten Alarm.
# Die Klasse legt der naechste `npx wrangler deploy` selbst an.
[[durable_objects.bindings]]
name = "BESUCHER_WECKER"
class_name = "BesucherWecker"

[[migrations]]
tag = "v1-besucher-wecker"
new_sqlite_classes = ["BesucherWecker"]

# D1-Datenbank (DB), angelegt am 24.09.2026 in Westeuropa (WEUR). Die ID ist
# kein Geheimnis, sie darf ins Repo. Zuerst schema.sql, dann die Dateien in
# migrations/ der Nummer nach (siehe README.md).
[[d1_databases]]
binding = "DB"
database_name = "disorder119-shop"
database_id = "ef1485f7-c816-414c-b7f0-9d92e6a3aa18"
migrations_dir = "migrations"

# ---------------------------------------------------------------- Testshop
# Derselbe Code als eigener Worker fuer den Testshop (test.disorder119.com,
# sandbox-edge.js): eigene D1-Datenbank, PayPal-Sandbox, SANDBOX="1" schaltet
# die Schutzweichen in sandbox.js ein (kein Schreiben in den echten Katalog,
# Mails nur an SANDBOX_MAIL_AN, Telegram mit "TEST"). Deploy:
#   npx wrangler deploy --env sandbox
# Secrets (PayPal-Sandbox, Telegram ...) traegt "12 - Testshop verbinden" ein.
[env.sandbox]
name = "disorder119-shop-worker-sandbox"
routes = [{ pattern = "api-test.disorder119.com", custom_domain = true }]
workers_dev = false
preview_urls = false

[env.sandbox.vars]
ADMIN_SESSION_HOURS = "24"
PAYPAL_ENVIRONMENT = "sandbox"
DHL_PRIVAT_ENVIRONMENT = "sandbox"
SANDBOX = "1"
GEO_SPERRE_LAENDER = "RU,BY,IN,KP,IR"

[env.sandbox.triggers]
crons = ["*/15 * * * *"]

[[env.sandbox.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1191"
simple = { limit = 20, period = 60 }

[[env.sandbox.ratelimits]]
name = "QUOTE_LIMITER"
namespace_id = "1193"
simple = { limit = 60, period = 60 }

[[env.sandbox.ratelimits]]
name = "WAECHTER_LIMITER"
namespace_id = "1196"
simple = { limit = 240, period = 60 }

[[env.sandbox.durable_objects.bindings]]
name = "BESUCHER_WECKER"
class_name = "BesucherWecker"

[[env.sandbox.d1_databases]]
binding = "DB"
database_name = "disorder119-shop-sandbox"
database_id = "abb212d3-5cce-4bab-8653-5bc58afb93d6"
migrations_dir = "migrations"
